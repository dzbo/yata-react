name: Test

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🟢 Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: ⚙️ Install
        run: pnpm install --frozen-lockfile

      - name: 🧪 Unit Test
        run: pnpm test

      - name: 🏗️ Build
        run: pnpm build
